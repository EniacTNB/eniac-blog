name: Deploy Blog


on:
  push:
    branches:
      - main


permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout blog
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Build Astro
        run: npm run build

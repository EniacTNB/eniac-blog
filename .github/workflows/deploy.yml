name: Deploy Blog


on:

  push:
    branches:
      - main


  repository_dispatch:
    types:
      - obsidian-update



permissions:

  contents: read
  pages: write
  id-token: write



concurrency:
  group: pages
  cancel-in-progress: false



jobs:


  build:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout blog
        uses: actions/checkout@v4


      - name: Checkout Obsidian
        uses: actions/checkout@v4
        with:
          repository: EniacTNB/Obsidian-Knowloedge
          path: obsidian
          token: ${{ secrets.OBSIDIAN_TOKEN }}


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Sync blog
        run: npm run sync-blog
        env:
          OBSIDIAN_PATH: ./obsidian/2-Area/博客写作/Posts


      - name: Build Astro
        run: npm run build


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
